<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="גן ניצנים">
<title>שירים גן ניצנים</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap">
<style>
/* נגן מוזיקה בשפת עיצוב של iOS: רקע אפור-מערכת, חומרים שקופים,
   קווי הפרדה דקים, וכותרת ענק. העטיפות הצבעוניות נושאות את הצבע. */
:root{
  color-scheme:light;
  --bg:#F2F2F7;                 /* systemGroupedBackground */
  --card:#FFFFFF;
  --fill:rgba(120,120,128,.12); /* systemFill */
  --fill-2:rgba(120,120,128,.08);
  --line:rgba(60,60,67,.16);    /* separator */
  --ink:#1C1C1E;                /* label */
  --muted:#8E8E93;              /* secondaryLabel */
  --muted-2:#AEAEB2;            /* tertiaryLabel */
  --accent:#00567A;
  --playing:#17913F;
  --c1:#5B8DEF; --c2:#2C4C9B;   /* צבע השיר הפעיל, נדרס מהקוד */
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0; padding:0; background:var(--bg)}
body{
  color:var(--ink);
  font-family:"Assistant",-apple-system,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  font-size:16px; line-height:1.45; -webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit}

/* ---------- עטיפת שיר ---------- */
.art{
  position:relative; flex:none; display:grid; place-items:center;
  background:linear-gradient(145deg, var(--c1) 0%, var(--c2) 100%);
  overflow:hidden;
}
.art::after{
  content:""; position:absolute; inset:0;
  background:radial-gradient(120% 90% at 18% 8%, rgba(255,255,255,.32), transparent 60%);
}
.art svg{
  position:relative; z-index:1;
  fill:none; stroke:#fff; stroke-width:1.7;
  stroke-linecap:round; stroke-linejoin:round;
}
.art.xs{width:46px; height:46px; border-radius:11px}
.art.xs svg{width:23px; height:23px; stroke-width:1.9}
.art.sm{width:58px; height:58px; border-radius:13px}
.art.sm svg{width:29px; height:29px}
.art.lg{
  width:min(64vw,34vh,250px); height:min(64vw,34vh,250px);
  border-radius:clamp(18px,4.6vw,30px);
  box-shadow:0 20px 44px rgba(0,0,0,.2);
}
.art.lg svg{width:40%; height:40%; stroke-width:1.5}

/* ---------- מסך הרשימה ---------- */
#listView{max-width:560px; margin-inline:auto; padding:0 16px 40px}
.top{padding:26px 4px 14px}
.top h1{margin:0; font-size:34px; font-weight:800; letter-spacing:-.032em; line-height:1.1}
.top .meta{margin:5px 0 0; font-size:14.5px; color:var(--muted); font-variant-numeric:tabular-nums}
.playall{
  margin-top:16px; width:100%; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:8px;
  font-size:16.5px; font-weight:700; color:#fff;
  background:var(--accent); border:none; border-radius:14px; padding:14px;
  -webkit-tap-highlight-color:transparent;
}
.playall svg{width:18px; height:18px; fill:currentColor}
.playall:active{opacity:.85}

.search{position:relative; margin:16px 0 2px}
.search input{
  width:100%; font:inherit; font-size:16px; color:var(--ink);
  background:var(--fill); border:none; border-radius:11px; padding:11px 40px 11px 12px;
}
.search input::placeholder{color:var(--muted)}
.search svg{
  position:absolute; inset-inline-end:13px; inset-block-start:50%; transform:translateY(-50%);
  width:17px; height:17px; fill:var(--muted); pointer-events:none;
}

/* רשימה בסגנון iOS: לבן, פינות מעוגלות, וקו הפרדה דק שמתחיל אחרי העטיפה */
ol.tracks{
  list-style:none; margin:14px 0 0; padding:0;
  background:var(--card); border-radius:14px; overflow:hidden;
}
.track{
  position:relative; display:flex; align-items:center; gap:13px;
  padding:9px 13px; cursor:pointer; -webkit-tap-highlight-color:transparent;
  transition:background .12s ease;
}
.track + .track::before{
  content:""; position:absolute; inset-block-start:0;
  inset-inline-start:84px; inset-inline-end:0;
  height:1px; background:var(--line); transform:scaleY(.5);
}
.track:active{background:var(--fill-2)}
.t-main{min-width:0; flex:1}
.t-name{
  display:block; font-weight:600; font-size:16.5px; letter-spacing:-.01em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.t-sub{
  display:block; font-size:13px; color:var(--muted); margin-top:1px;
  font-variant-numeric:tabular-nums;
}
.track.playing .t-name{color:var(--playing)}
.track.playing .t-sub{color:var(--playing); font-weight:700}
.bars{display:inline-flex; align-items:flex-end; gap:2px; height:11px; margin-inline-end:6px; vertical-align:-1px}
.bars i{width:2.5px; background:var(--playing); border-radius:1px; animation:eq .9s ease-in-out infinite}
.bars i:nth-child(1){height:40%; animation-delay:-.2s}
.bars i:nth-child(2){height:100%; animation-delay:-.5s}
.bars i:nth-child(3){height:65%}
@keyframes eq{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
.empty{text-align:center; color:var(--muted); padding:40px 20px}
.foot{padding:22px 10px 0; text-align:center; color:var(--muted-2); font-size:12.5px; line-height:1.7}

/* ---------- סרגל "מתנגן עכשיו" ---------- */
body.has-mini #listView{padding-bottom:116px}
.mini{
  position:fixed; inset-inline:0; inset-block-end:0; z-index:15;
  background:rgba(249,249,252,.82);
  -webkit-backdrop-filter:saturate(180%) blur(22px);
  backdrop-filter:saturate(180%) blur(22px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
  animation:miniUp .26s cubic-bezier(.2,.7,.3,1);
}
@keyframes miniUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.mini-prog{height:2px; background:rgba(120,120,128,.16); overflow:hidden}
.mini-prog span{
  display:block; height:100%; width:0;
  background:linear-gradient(90deg, var(--mc1,#5B8DEF), var(--mc2,#2C4C9B));
  transition:width .25s linear;
}
.mini-row{max-width:560px; margin-inline:auto; display:flex; align-items:center; gap:12px; padding:8px 14px}
.mini-open{
  flex:1; min-width:0; display:flex; align-items:center; gap:12px;
  background:none; border:none; padding:0; cursor:pointer; text-align:start;
  color:var(--ink); -webkit-tap-highlight-color:transparent;
}
.mini-main{min-width:0; flex:1}
.mini-name{
  display:block; font-weight:600; font-size:15px; letter-spacing:-.01em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.mini-state{display:block; font-size:12.5px; color:var(--muted); margin-top:1px}
.mini-play{
  flex:none; width:46px; height:46px; border-radius:50%; cursor:pointer;
  background:var(--fill); color:var(--ink); border:none; display:grid; place-items:center;
  -webkit-tap-highlight-color:transparent;
}
.mini-play svg{width:20px; height:20px; fill:currentColor}
.mini-open:active{opacity:.6}
.mini-play:active{background:rgba(120,120,128,.2)}

/* ---------- מסך הנגן ---------- */
#playerView{
  position:fixed; inset:0; z-index:20; background:var(--bg);
  display:flex; flex-direction:column; overflow-y:auto;
  animation:rise .32s cubic-bezier(.22,.72,.24,1);
}
@keyframes rise{from{transform:translateY(100%)}to{transform:translateY(0)}}
.glow{
  position:absolute; inset:0; pointer-events:none;
  background:
    radial-gradient(95% 52% at 50% 0%, var(--c1), transparent 68%),
    radial-gradient(70% 38% at 50% 0%, var(--c2), transparent 72%);
  opacity:.3; transition:opacity .4s ease;
}
.pbar{
  position:relative; z-index:1; flex:none;
  padding:calc(11px + env(safe-area-inset-top)) 14px 2px;
  display:flex; align-items:center; gap:10px;
}
.back, .sleep{
  cursor:pointer; border:none; color:var(--ink);
  background:rgba(255,255,255,.7);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  -webkit-tap-highlight-color:transparent;
}
.back{width:40px; height:40px; border-radius:50%; display:grid; place-items:center; flex:none}
.back svg{width:18px; height:18px; fill:currentColor}
.pbar-label{
  flex:1; font-size:11.5px; font-weight:700; letter-spacing:.14em; color:var(--muted);
}
.sleep{
  flex:none; display:flex; align-items:center; gap:6px;
  height:40px; border-radius:20px; padding:0 14px;
  font-size:13px; font-weight:600; font-variant-numeric:tabular-nums;
}
.sleep svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.sleep.on{background:var(--accent); color:#fff}
.back:active, .sleep:active{opacity:.6}

.stage{
  position:relative; z-index:1; flex:1 1 auto; min-height:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:3px; text-align:center; padding:8px 24px;
}
.p-name{margin:24px 0 0; font-size:27px; font-weight:800; line-height:1.2; letter-spacing:-.03em; max-width:100%}
.p-state{margin:5px 0 0; font-size:14px; color:var(--muted)}
.p-pos{
  margin:3px 0 0; font-size:11.5px; font-weight:700; letter-spacing:.13em;
  color:var(--muted-2); font-variant-numeric:tabular-nums;
}
.panel{
  position:relative; z-index:1; flex:none;
  padding:8px 24px calc(18px + env(safe-area-inset-bottom));
  display:flex; flex-direction:column; gap:3px;
}
input[type=range]{
  direction:ltr; width:100%; margin:0; height:26px; cursor:pointer;
  background:transparent; accent-color:var(--c2);
}
.times{
  direction:ltr; display:flex; justify-content:space-between; margin-top:-6px;
  font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums;
}
.pcontrols{direction:ltr; display:flex; align-items:center; justify-content:center; gap:12px; padding-top:10px}
.pcontrols button{
  flex:none; border:none; background:transparent; color:var(--ink); cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  border-radius:50%; -webkit-tap-highlight-color:transparent;
}
.pcontrols .ctl, .pcontrols .skip{width:58px; height:58px; background:var(--fill)}
.pcontrols .ctl svg, .pcontrols .skip svg{width:21px; height:21px; fill:currentColor}
.pcontrols .lbl{font-size:9.5px; font-weight:600; color:var(--muted); white-space:nowrap}
.pcontrols .big{
  width:78px; height:78px; background:var(--ink); color:#fff; flex:none;
  box-shadow:0 10px 24px rgba(0,0,0,.24);
}
.pcontrols .big svg{width:30px; height:30px; fill:currentColor}
.pcontrols button:active{opacity:.6}
.pcontrols button:disabled{opacity:.3; cursor:default}
.p-next{margin:14px 0 0; text-align:center; font-size:13px; color:var(--muted)}
.p-next b{color:var(--ink); font-weight:700}

/* ---------- גיליון הטיימר ---------- */
.sheet{position:fixed; inset:0; z-index:30; display:flex; align-items:flex-end; justify-content:center}
.sheet-bg{position:absolute; inset:0; background:rgba(0,0,0,.3)}
.sheet-card{
  position:relative; width:100%; max-width:430px;
  margin:0 8px calc(8px + env(safe-area-inset-bottom));
  background:rgba(249,249,252,.96);
  -webkit-backdrop-filter:blur(22px); backdrop-filter:blur(22px);
  border-radius:16px; overflow:hidden;
  animation:sheetUp .28s cubic-bezier(.22,.72,.24,1);
}
@keyframes sheetUp{from{transform:translateY(16px); opacity:0}to{transform:translateY(0); opacity:1}}
.sheet-title{margin:0; padding:14px; text-align:center; font-size:13px; color:var(--muted); border-bottom:1px solid var(--line)}
.sheet-card button{
  display:block; width:100%; background:none; border:none; cursor:pointer;
  padding:15px; font-size:17.5px; color:var(--accent);
  border-bottom:1px solid var(--line); -webkit-tap-highlight-color:transparent;
}
.sheet-card button:last-child{border-bottom:none; font-weight:700}
.sheet-card button:active{background:var(--fill)}
.sheet-card button.sel{font-weight:800}

@media (max-width:380px){
  .panel{padding-inline:14px}
  .pcontrols{gap:7px}
  .pcontrols .ctl, .pcontrols .skip{width:48px; height:48px}
  .pcontrols .ctl svg, .pcontrols .skip svg{width:18px; height:18px}
  .pcontrols .lbl{font-size:9px}
  .pcontrols .big{width:68px; height:68px}
  .pcontrols .big svg{width:26px; height:26px}
}
@media (max-height:640px){
  .p-name{margin-top:14px; font-size:23px}
  .pcontrols{padding-top:4px}
}
:focus-visible{outline:3px solid var(--accent); outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none !important; animation:none !important}}
</style>
</head>
<body>

<div id="listView">
  <header class="top">
    <h1>שירים גן ניצנים</h1>
    <p class="meta" id="heroMeta">טוען…</p>
    <button class="playall" id="playAll">
      <svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>
      נגן הכול
    </button>
  </header>

  <div class="search">
    <input type="search" id="q" placeholder="חיפוש שיר" autocomplete="off" aria-label="חיפוש שיר">
    <svg viewBox="0 0 24 24"><path d="M10 4a6 6 0 104.2 10.3l4.3 4.2 1.4-1.4-4.2-4.3A6 6 0 0010 4zm0 2a4 4 0 110 8 4 4 0 010-8z"/></svg>
  </div>

  <ol class="tracks" id="tracks"></ol>
  <p class="empty" id="empty" hidden>לא נמצא שיר בשם הזה</p>
  <p class="foot">השירים ממשיכים אחד אחרי השני · אפשר לנעול את המסך</p>
</div>

<div id="playerView" hidden>
  <div class="glow" id="glow"></div>

  <div class="pbar">
    <button class="back" id="back" aria-label="חזרה לרשימה">
      <svg viewBox="0 0 24 24"><path d="M10 6l1.4 1.4L7.8 11H20v2H7.8l3.6 3.6L10 18l-6-6z"/></svg>
    </button>
    <span class="pbar-label">מתנגן עכשיו</span>
    <button class="sleep" id="sleepBtn" aria-label="טיימר שינה">
      <svg viewBox="0 0 24 24"><path d="M20.5 14.4A8.6 8.6 0 019.6 3.5 8.6 8.6 0 1020.5 14.4z"/></svg>
      <span id="sleepLbl">טיימר</span>
    </button>
  </div>

  <div class="stage">
    <div class="art lg" id="pArt"></div>
    <h2 class="p-name" id="pName"></h2>
    <p class="p-state" id="pState">מוכן להשמעה</p>
    <p class="p-pos" id="pPos"></p>
  </div>

  <div class="panel">
    <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="מיקום בשיר">
    <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
    <div class="pcontrols">
      <button class="ctl" id="prevSong" aria-label="לשיר הקודם">
        <svg viewBox="0 0 24 24"><path d="M6 6h2.5v12H6zM20 6v12l-9-6z"/></svg><span class="lbl">שיר קודם</span>
      </button>
      <button class="skip" id="back15" aria-label="אחורה 15 שניות">
        <svg viewBox="0 0 24 24"><path d="M12 5V1.5L7.5 6 12 10.5V7a5.5 5.5 0 11-5.5 5.5h-2A7.5 7.5 0 1012 5z"/></svg>
        <span class="lbl">15 שנ׳</span>
      </button>
      <button class="big" id="play" aria-label="נגן">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>
      </button>
      <button class="skip" id="fwd15" aria-label="קדימה 15 שניות">
        <svg viewBox="0 0 24 24"><path d="M12 5V1.5L16.5 6 12 10.5V7a5.5 5.5 0 105.5 5.5h2A7.5 7.5 0 1112 5z"/></svg>
        <span class="lbl">15 שנ׳</span>
      </button>
      <button class="ctl" id="nextSong" aria-label="לשיר הבא">
        <svg viewBox="0 0 24 24"><path d="M15.5 6H18v12h-2.5zM4 6l9 6-9 6z"/></svg><span class="lbl">שיר הבא</span>
      </button>
    </div>
    <p class="p-next" id="pNext" hidden></p>
  </div>
</div>

<div class="mini" id="mini" hidden>
  <div class="mini-prog"><span id="miniFill"></span></div>
  <div class="mini-row">
    <button class="mini-open" id="miniOpen" aria-label="פתיחת הנגן">
      <span class="art xs" id="miniArt"></span>
      <span class="mini-main">
        <span class="mini-name" id="miniName"></span>
        <span class="mini-state" id="miniState"></span>
      </span>
    </button>
    <button class="mini-play" id="miniPlay" aria-label="נגן">
      <svg id="miniIcon" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>
    </button>
  </div>
</div>

<div class="sheet" id="sleepSheet" hidden>
  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet-card">
    <p class="sheet-title">הפסקת ההשמעה בעוד</p>
    <button data-m="15">15 דקות</button>
    <button data-m="30">30 דקות</button>
    <button data-m="45">45 דקות</button>
    <button data-m="60">שעה</button>
    <button data-m="end">בסוף השיר הנוכחי</button>
    <button data-m="0">ביטול הטיימר</button>
  </div>
</div>

<audio id="audio" preload="metadata"></audio>

<script>

const audio = $('audio');
let SONGS = [], current = null, playing = false, seeking = false, lastSave = 0, query = '';

  leaf:  '<path d="M19.6 4.4C10 4.4 4.4 9 4.4 15.5c0 1.6.4 3 .9 4 5.7.6 14.3-2.6 14.3-15.1z"/><path d="M5.4 19.6C8.5 15 12.6 11.4 17.1 9.4"/>',
  candle:'<path d="M9.4 10.6h5.2v9.9H9.4z"/><path d="M12 10.6V8.9"/><path d="M12 3.4c1.7 1.7 2.7 2.7 2.7 4.2A2.7 2.7 0 0112 10.3a2.7 2.7 0 01-2.7-2.7c0-1.5 1-2.5 2.7-4.2z"/>',
  fire:  '<path d="M12 3.4c3.1 3.5 5.6 5.7 5.6 9.4A5.6 5.6 0 0112 18.5a5.6 5.6 0 01-5.6-5.7c0-3.7 2.5-5.9 5.6-9.4z"/><path d="M12 11c1.3 1.6 2.3 2.5 2.3 4a2.3 2.3 0 11-4.6 0c0-1.5 1-2.4 2.3-4z"/>',
  tree:  '<path d="M12 20.6v-3.8"/><path d="M12 3.4L7.4 9.6h9.2z"/><path d="M12 8.4l-5.6 8.4h11.2z"/>',
  snow:  '<path d="M12 3v18M4.2 7.5l15.6 9M19.8 7.5l-15.6 9"/><path d="M9.2 5L12 6.7 14.8 5M9.2 19L12 17.3l2.8 1.7"/>',
  heart: '<path d="M12 19.6s-7.1-4.4-7.1-9.1A3.95 3.95 0 0112 8.3a3.95 3.95 0 017.1 2.2c0 4.7-7.1 9.1-7.1 9.1z"/>',
  flag:  '<path d="M6 21.2V3.2"/><path d="M6 4.7h13.2l-2.7 3.7 2.7 3.7H6z"/>',
  wheat: '<path d="M12 21V8.8"/><path d="M12 8.8c0-2 1.3-3.3 3.1-3.3 0 2-1.3 3.3-3.1 3.3zM12 8.8c0-2-1.3-3.3-3.1-3.3 0 2 1.3 3.3 3.1 3.3z"/><path d="M12 13.4c0-2 1.3-3.3 3.1-3.3 0 2-1.3 3.3-3.1 3.3zM12 13.4c0-2-1.3-3.3-3.1-3.3 0 2 1.3 3.3 3.1 3.3z"/>',
  wave:  '<circle cx="12" cy="8.2" r="3.3"/><path d="M3 16c1.5 0 1.5 1.6 3 1.6S7.5 16 9 16s1.5 1.6 3 1.6S13.5 16 15 16s1.5 1.6 3 1.6S19.5 16 21 16"/>',
  candles:'<path d="M8.4 11.6h1.9v8h-1.9zM13.7 11.6h1.9v8h-1.9z"/><path d="M9.35 8.3c.9.9 1.3 1.4 1.3 2.1a1.3 1.3 0 11-2.6 0c0-.7.4-1.2 1.3-2.1zM14.65 8.3c.9.9 1.3 1.4 1.3 2.1a1.3 1.3 0 11-2.6 0c0-.7.4-1.2 1.3-2.1z"/><path d="M6.9 19.6h10.2"/>',
  mask:  '<path d="M3.7 9.3c0-1.1.9-1.9 2-1.8 1.8.2 4.1.6 6.3.6s4.5-.4 6.3-.6c1.1-.1 2 .7 2 1.8 0 3.6-2.3 7.3-5.2 7.3-1.6 0-2.3-1.2-3.1-1.2s-1.5 1.2-3.1 1.2c-2.9 0-5.2-3.7-5.2-7.3z"/><circle cx="8.3" cy="10.9" r="1"/><circle cx="15.7" cy="10.9" r="1"/>',
  note:  '<path d="M9.2 18V6.2l10-2.1v11.8"/><circle cx="6.6" cy="18" r="2.6"/><circle cx="16.6" cy="15.9" r="2.6"/>'
};
const LOOKS = {
  morning:       ['#FFC46B', '#F0702F', 'sun'],
  shabbat:       ['#FFE1A3', '#C98B2E', 'candles'],
  kids:          ['#FF84C2', '#B23FD0', 'balloon'],
  garden:        ['#7EE0A1', '#2A9D6B', 'flower'],
  rosh:          ['#FF9A76', '#B8232B', 'apple'],
  sukkot:        ['#EBBE72', '#9A6425', 'palm'],
  autumn:        ['#F7A95C', '#B14A1E', 'leaf'],
  hanukkah:      ['#FFDC80', '#5460C4', 'candle'],
  tubishvat:     ['#A6DD6B', '#2F7D3C', 'tree'],
  winter:        ['#97D4FF', '#2F62CE', 'snow'],
  family:        ['#FFA0B4', '#CF4571', 'heart'],
  purim:         ['#FFC24B', '#DC3A86', 'mask'],
  'spring-1':    ['#C3EC7E', '#46A06A', 'flower'],
  'spring-2':    ['#AEE88E', '#3C9A72', 'flower'],
  'spring-3':    ['#9CE3A4', '#348F79', 'flower'],
  independence:  ['#8CC4FF', '#2652BE', 'flag'],
  lagbaomer:     ['#FFC05C', '#C9341C', 'fire'],
  shavuot:       ['#F7DC90', '#BE9234', 'wheat'],
  'summer-1':    ['#6FE3D2', '#1A86C2', 'wave'],
  'summer-2':    ['#5FD9E0', '#1570B8', 'wave']
};
const look = id => LOOKS[id] || ['#7E8CA8', '#3B475E', 'note'];
const artHTML = (id, size) => {
  const [c1, c2, g] = look(id);
  return '<span class="art ' + size + '" style="--c1:' + c1 + '; --c2:' + c2 + '">' +
         '<svg viewBox="0 0 24 24">' + G[g] + '</svg></span>';
};

const fmt = s => {
  s = Math.max(0, Math.floor(s || 0));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return h ? h + ':' + String(m).padStart(2, '0') + ':' + String(x).padStart(2, '0')
           : m + ':' + String(x).padStart(2, '0');
};
const heTime = s => {
  let h = Math.floor(s / 3600), m = Math.round(s % 3600 / 60);
  if (m === 60) { h += 1; m = 0; }
  if (!h) return m + ' דקות';
  const hours = h === 1 ? 'שעה' : h + ' שעות';
  return m ? hours + ' ו-' + m + ' דקות' : hours;
};
const saved = id => { try { return parseFloat(localStorage.getItem('pos:' + id)) || 0; } catch (e) { return 0; } };
const save = (id, v) => { try { localStorage.setItem('pos:' + id, v); } catch (e) {} };

/* ---------- הספרייה ---------- */
async function load() {
  const res = await fetch('songs.json', { cache: 'no-cache' });
  SONGS = await res.json();
  $('heroMeta').textContent =
    SONGS.length + ' שירים · ' + heTime(SONGS.reduce((s, x) => s + x.seconds, 0));
  renderList();
  openFromHash();
}

function visible() {
  const q = query.trim();
  return SONGS.filter(s => !q || s.name.includes(q));
}

function renderList() {
  const rows = visible();
  $('empty').hidden = rows.length > 0;
  $('tracks').replaceChildren(...rows.map(s => {
    const nowPlaying = current && current.id === s.id && playing;
    const li = document.createElement('li');
    li.className = 'track' + (nowPlaying ? ' playing' : '');
    li.tabIndex = 0;
    li.setAttribute('role', 'button');
    li.setAttribute('aria-label', 'נגן את ' + s.name);
    li.innerHTML = artHTML(s.id, 'sm') +
      '<span class="t-main"><span class="t-name"></span><span class="t-sub"></span></span>';
    li.querySelector('.t-name').textContent = s.name;
    const sub = li.querySelector('.t-sub');
    if (nowPlaying) {
      sub.innerHTML = '<span class="bars"><i></i><i></i><i></i></span>מתנגן עכשיו';
    } else {
      sub.textContent = fmt(s.seconds);
    }
    const go = () => openSong(s.id, 'push');
    li.addEventListener('click', go);
    li.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); }
    });
    return li;
  }));
}

/* ---------- מסכים ---------- */
const idxOf = id => SONGS.findIndex(s => s.id === id);
const neighbour = d => {
  const i = idxOf(current && current.id);
  return i < 0 ? null : (SONGS[i + d] || null);
};
/* משיכה מראש של תחילת השיר הבא, כדי שהמעבר יהיה כמעט מיידי */
function prefetchNext() {
  const n = neighbour(1);
  if (!n) return;
  fetch(n.file, { headers: { Range: 'bytes=0-262143' } }).catch(() => {});
}

function openSong(id, mode, keepState) {
  const song = SONGS.find(s => s.id === id);
  if (!song) return;
  if (!current || current.id !== id) {
    current = song;
    audio.src = song.file;
    const at = saved(id);
    if (at > 5 && at < song.seconds - 10) {
      audio.addEventListener('loadedmetadata', () => { try { audio.currentTime = at; } catch (e) {} }, { once: true });
    }
  }
  const [c1, c2] = look(id);
  $('playerView').style.setProperty('--c1', c1);
  $('playerView').style.setProperty('--c2', c2);
  const art = $('pArt');
  art.style.setProperty('--c1', c1);
  art.style.setProperty('--c2', c2);
  art.innerHTML = '<svg viewBox="0 0 24 24">' + G[look(id)[2]] + '</svg>';
  $('pName').textContent = song.name;
  if (!$('listView').hidden) listScroll = window.scrollY;
  $('listView').hidden = true;
  $('playerView').hidden = false;
  window.scrollTo(0, 0);
  tick();
  paint();
  const entry = [{ song: id }, '', '#' + encodeURIComponent(id)];
  if (mode === 'push') history.pushState(...entry);
  else if (mode === 'replace') history.replaceState(...entry);
  if (!keepState) audio.play().catch(() => {});  /* הלחיצה שהביאה לכאן נחשבת למחווה של המשתמש */
  syncMini();
  prefetchNext();
}

function showList(push) {
  $('playerView').hidden = true;
  $('listView').hidden = false;
  renderList();
  syncMini();
  requestAnimationFrame(() => window.scrollTo(0, listScroll));
  if (push) history.pushState({ song: null }, '', location.pathname + location.search);
}

function openFromHash() {
  const id = decodeURIComponent((location.hash || '').replace(/^#/, ''));
  if (id && SONGS.some(s => s.id === id)) {
    /* מישהו נכנס לקישור של שיר בודד: שמים את הרשימה מתחתיו בהיסטוריה,
       כדי שכפתור החזור יראה אותה במקום לצאת מהאתר */
    history.replaceState({ song: null }, '', location.pathname + location.search);
    openSong(id, 'push');
  } else {
    showList(false);
  }
}

$('back').addEventListener('click', () => history.back());
window.addEventListener('popstate', e => {
  const id = e.state && e.state.song;
  if (id) openSong(id, 'none'); else showList(false);
});

/* ---------- נגינה ---------- */
function paint() {
  const pauseIcon = '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
  const playIcon = '<path d="M8 5.5v13l11-6.5z"/>';
  $('playIcon').innerHTML = playing ? pauseIcon : playIcon;
  const next = neighbour(1), prev = neighbour(-1);
  $('pPos').textContent = 'שיר ' + (idxOf(current && current.id) + 1) + ' מתוך ' + SONGS.length;
  $('pNext').hidden = !next;
  if (next) {
    $('pNext').innerHTML = 'הבא בתור: <b></b>';
    $('pNext').querySelector('b').textContent = next.name;
  }
  $('nextSong').disabled = !next;
  $('prevSong').disabled = !prev;
  $('play').setAttribute('aria-label', playing ? 'השהה' : 'נגן');
  $('pState').textContent = buffering ? 'טוען…' : (playing ? 'מתנגן' : 'מושהה');
  if (!$('mini').hidden || current) syncMini();
  if (current && 'mediaSession' in navigator) {
    if (metaId !== current.id) { metaId = current.id; setMeta(current); }
    navigator.mediaSession.playbackState = playing ? 'playing' : 'paused';
  }
}
function tick() {
  if (!current) return;
  if (!$('mini').hidden) syncMini();
  const total = audio.duration || current.seconds, cur = audio.currentTime || 0;
  if (!seeking) $('seek').value = total ? Math.round(cur / total * 1000) : 0;
  $('tCur').textContent = fmt(cur);
  $('tDur').textContent = fmt(total);
}
audio.addEventListener('play',  () => { playing = true;  paint(); });
audio.addEventListener('pause', () => { playing = false; paint(); });
audio.addEventListener('timeupdate', () => {
  tick();
  const now = Date.now();
  if (current && now - lastSave > 4000) { lastSave = now; save(current.id, audio.currentTime); }
});
audio.addEventListener('ended', () => {
  if (current) save(current.id, 0);
  if (sleepEndOfSong) { setSleep(0); playing = false; paint(); syncMini(); return; }
  const next = neighbour(1);
  if (next) { openSong(next.id, 'replace'); return; }
  playing = false; paint();
});
const setBuffering = on => { buffering = on; paint(); };
audio.addEventListener('waiting',    () => setBuffering(true));
audio.addEventListener('stalled',    () => setBuffering(true));
audio.addEventListener('playing',    () => setBuffering(false));
audio.addEventListener('canplay',    () => setBuffering(false));
audio.addEventListener('loadeddata', () => setBuffering(false));
audio.addEventListener('error', () => {
  buffering = false;
  $('pState').textContent = 'לא הצלחתי לטעון · בדקו את החיבור';
});

$('play').addEventListener('click', () => playing ? audio.pause() : audio.play().catch(() => {}));
$('nextSong').addEventListener('click', () => { const n = neighbour(1); if (n) openSong(n.id, 'replace'); });
$('prevSong').addEventListener('click', () => { const p = neighbour(-1); if (p) openSong(p.id, 'replace'); });
$('back15').addEventListener('click', () => { audio.currentTime = Math.max(0, audio.currentTime - 15); });
$('fwd15').addEventListener('click', () => {
  audio.currentTime = Math.min((audio.duration || 0) - 1, audio.currentTime + 15);
});
$('playAll').addEventListener('click', () => { if (SONGS.length) openSong(SONGS[0].id, 'push'); });

const seek = $('seek');
['pointerdown', 'touchstart', 'keydown'].forEach(e => seek.addEventListener(e, () => { seeking = true; }));
seek.addEventListener('input', () => {
  const total = audio.duration || (current && current.seconds) || 0;
  $('tCur').textContent = fmt(seek.value / 1000 * total);
});
seek.addEventListener('change', () => {
  seeking = false;
  const total = audio.duration || (current && current.seconds) || 0;
  if (total) audio.currentTime = seek.value / 1000 * total;
});
if ('mediaSession' in navigator) {
  try {
    navigator.mediaSession.setActionHandler('play', () => audio.play().catch(() => {}));
    navigator.mediaSession.setActionHandler('pause', () => audio.pause());
    navigator.mediaSession.setActionHandler('nexttrack', () => { const n = neighbour(1); if (n) openSong(n.id, 'replace'); });
    navigator.mediaSession.setActionHandler('previoustrack', () => { const p = neighbour(-1); if (p) openSong(p.id, 'replace'); });
    navigator.mediaSession.setActionHandler('seekto', d => {
      if (d.seekTime != null) audio.currentTime = d.seekTime;
    });
  } catch (e) {}
}

/* ---------- עטיפה למסך הנעילה ---------- */
const coverCache = new Map();
function coverSVG(id) {
  const [c1, c2, g] = look(id);
  return '<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 24 24">' +
    '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
    '<stop offset="0" stop-color="' + c1 + '"/><stop offset="1" stop-color="' + c2 + '"/>' +
    '</linearGradient></defs><rect width="24" height="24" fill="url(#g)"/>' +
    '<g fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"' +
    ' transform="translate(4.8 4.8) scale(0.6)">' + G[g] + '</g></svg>';
}
function coverPNG(id) {
  if (coverCache.has(id)) return Promise.resolve(coverCache.get(id));
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      try {
        const c = document.createElement('canvas');
        c.width = c.height = 512;
        c.getContext('2d').drawImage(img, 0, 0, 512, 512);
        const url = c.toDataURL('image/png');
        coverCache.set(id, url);
        res(url);
      } catch (e) { res(null); }
    };
    img.onerror = () => res(null);
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(coverSVG(id));
  });
}
let metaId = null;
async function setMeta(song) {
  const base = { title: song.name, artist: 'גן ניצנים' };
  navigator.mediaSession.metadata = new MediaMetadata(base);
  const url = await coverPNG(song.id);
  if (url && current && current.id === song.id) {
    navigator.mediaSession.metadata = new MediaMetadata(Object.assign({}, base, {
      artwork: [{ src: url, sizes: '512x512', type: 'image/png' }]
    }));
  }
}

/* ---------- טיימר שינה ---------- */
let sleepAt = 0, sleepEndOfSong = false, sleepTimer = null;
function sleepLabel() {
  if (sleepEndOfSong) return 'סוף השיר';
  if (!sleepAt) return 'טיימר';
  const left = Math.max(0, sleepAt - Date.now());
  const m = Math.floor(left / 60000), sec = Math.floor(left % 60000 / 1000);
  return m + ':' + String(sec).padStart(2, '0');
}
function renderSleep() {
  $('sleepBtn').classList.toggle('on', !!sleepAt || sleepEndOfSong);
  $('sleepLbl').textContent = sleepLabel();
}
function setSleep(v) {
  clearInterval(sleepTimer);
  sleepTimer = null; sleepAt = 0; sleepEndOfSong = false;
  if (v === 'end') {
    sleepEndOfSong = true;
  } else if (v > 0) {
    sleepAt = Date.now() + v * 60000;
    sleepTimer = setInterval(() => {
      if (Date.now() >= sleepAt) { audio.pause(); setSleep(0); }
      else renderSleep();
    }, 1000);
  }
  renderSleep();
}
$('sleepBtn').addEventListener('click', () => {
  const cur = sleepEndOfSong ? 'end' : (sleepAt ? '' : '0');
  document.querySelectorAll('.sheet-card button').forEach(b =>
    b.classList.toggle('sel', b.dataset.m === cur));
  $('sleepSheet').hidden = false;
});
$('sleepSheet').addEventListener('click', e => {
  const b = e.target.closest('button[data-m]');
  if (b) {
    setSleep(b.dataset.m === 'end' ? 'end' : Number(b.dataset.m));
    $('sleepSheet').hidden = true;
    return;
  }
  if (e.target.id === 'sheetBg') $('sleepSheet').hidden = true;
});
renderSleep();

/* ---------- סרגל "מתנגן עכשיו" ---------- */
function syncMini() {
  const show = !!current && $('playerView').hidden;
  $('mini').hidden = !show;
  document.body.classList.toggle('has-mini', show);
  if (!show) return;
  const [c1, c2, g] = look(current.id);
  const art = $('miniArt');
  if (art.dataset.id !== current.id) {
    art.dataset.id = current.id;
    art.style.setProperty('--c1', c1);
    art.style.setProperty('--c2', c2);
    art.innerHTML = '<svg viewBox="0 0 24 24">' + G[g] + '</svg>';
    $('mini').style.setProperty('--mc1', c1);
    $('mini').style.setProperty('--mc2', c2);
  }
  $('miniName').textContent = current.name;
  $('miniState').textContent = buffering ? 'טוען…' : (playing ? 'מתנגן עכשיו' : 'מושהה');
  $('miniIcon').innerHTML = playing
    ? '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>'
    : '<path d="M8 5.5v13l11-6.5z"/>';
  $('miniPlay').setAttribute('aria-label', playing ? 'השהה' : 'נגן');
  const total = audio.duration || current.seconds || 0;
  $('miniFill').style.width = total ? ((audio.currentTime || 0) / total * 100) + '%' : '0';
}
$('miniOpen').addEventListener('click', () => { if (current) openSong(current.id, 'push', true); });
$('miniPlay').addEventListener('click', () => playing ? audio.pause() : audio.play().catch(() => {}));

$('q').addEventListener('input', e => { query = e.target.value; renderList(); });
window.addEventListener('pagehide', () => { if (current) save(current.id, audio.currentTime); });

load().catch(() => {
  $('heroMeta').textContent = 'לא ניתן לטעון את רשימת השירים';
});
</script>
</body>
</html>
